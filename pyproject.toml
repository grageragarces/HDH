[tool.poetry]
name = "hdh"
version = "0.4.0"
description = "Hybrid Dependency Hypergraphs for quantum computation: translation, visualization, and partitioning."
authors = ["Maria Gragera Garces <m.gragera.gaces@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "hdh"},
]
exclude = [
  "hdh/database",
  "hdh/database/**/*",
]
homepage = "https://pypi.org/project/hdh/"
repository = "https://github.com/grageragarces/hdh"
keywords = ["quantum", "compiler", "partitioning", "hdh", "hypergraph"]

[tool.poetry.dependencies]
python = "^3.10, <3.14"
qiskit = ">=1.0,<3.0"
networkx = "^3.0"
matplotlib = "^3.0"
kahypar = {version = "^1.3.6", optional = true}
pennylane = {version = "^0.45", optional = true, python = ">=3.11,<3.14"}
cirq = {version = "^1.7", optional = true, python = ">=3.11,<3.14"}
amazon-braket-sdk = {version = "^1.125", optional = true, python = ">=3.11,<3.14"}
metis = {version = "0.2a5", optional = true}

[tool.poetry.extras]
kahypar = ["kahypar"]
pennylane = ["pennylane"]
cirq = ["cirq"]
braket = ["amazon-braket-sdk"]
metis = ["metis"]
all = ["kahypar", "pennylane", "cirq", "amazon-braket-sdk", "metis"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
kahypar = "^1.3.6"
pennylane = {version = "^0.45", python = ">=3.11,<3.14"}
cirq = {version = "^1.7", python = ">=3.11,<3.14"}
amazon-braket-sdk = {version = "^1.125", python = ">=3.11,<3.14"}
metis = "0.2a5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
